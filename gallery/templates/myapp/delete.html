{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Post</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="delete-wrapper">

    <h2>Are you sure you want to delete this post?</h2>

    <h3>{{ post.title }}</h3>

    <form method="POST">
        {% csrf_token %}
        <button style="background: linear-gradient(brown,white) ; border-radius: 20px;" type="submit">Yes, Delete</button>
    </form>

    <br>
    <button style="background:linear-gradient(to right,white,red); border-radius: 20px;"><a href="{% url 'post_detail' post.id %}">Cancel</a></button>

</div>

</body>
</html>
