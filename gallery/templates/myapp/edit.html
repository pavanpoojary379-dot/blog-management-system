{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Create / Update Post</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="form-wrapper">

    <h2>Create / Edit Post</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button style="background:linear-gradient(to right,orange, white); border-radius: 20px;" type="submit">Save</button>
    </form>

    <br>
    <a href="{% url 'product_list' %}">⬅ Back to Home</a>

</div>

</body>
</html>
